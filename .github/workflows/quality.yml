name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:w10
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:evidence
      - name: Upload W10 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10-release-evidence
          path: .tmp/release-evidence
          if-no-files-found: warn
          retention-days: 14
